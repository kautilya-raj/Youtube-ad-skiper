<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 220px;
      background: #0a0a0a;
      color: #fff;
      font-family: 'Space Mono', monospace;
      padding: 20px;
      user-select: none;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #ff0000;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .logo-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #fff;
    }

    .status {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-label {
      font-size: 10px;
      color: #666;
      letter-spacing: 0.08em;
      vertical-align: middle;
    }

    .count {
      font-size: 36px;
      font-weight: 700;
      color: #ff0000;
      margin: 10px 0 2px;
      line-height: 1;
    }

    .count-label {
      font-size: 9px;
      color: #444;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .divider {
      border: none;
      border-top: 1px solid #1a1a1a;
      margin: 14px 0;
    }

    .note {
      font-size: 9px;
      color: #333;
      line-height: 1.6;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">⏭</div>
    <div class="logo-text">YT AD SKIPPER</div>
  </div>

  <div class="status">
    <div>
      <span class="status-dot"></span>
      <span class="status-label">ACTIVE</span>
    </div>
    <div class="count" id="count">0</div>
    <div class="count-label">ads skipped</div>
  </div>

  <hr class="divider">

  <div class="note">
    Skippable ads → auto-clicked.<br>
    Unskippable ads → muted &amp; fast-forwarded.
  </div>

  <script src="popup.js"></script>
</body>
</html>
